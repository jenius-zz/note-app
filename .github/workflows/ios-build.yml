name: iOS Build

# 每次 push 自动在 GitHub 的免费 macOS 云主机上编译验证
# 免费账号每月 2000 分钟额度，macOS 按 10 倍消耗 = 每月约 200 分钟 macOS 时间
# 一次构建约 5-10 分钟，省着用足够迭代

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'NoteApp/**'
      - 'NoteAppWidget/**'
      - 'NoteAppUITests/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: >
          xcodebuild
          -project NoteApp.xcodeproj
          -scheme NoteApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -derivedDataPath build/derived
          build

      - name: Run UI tests and capture screenshots
        run: >
          xcodebuild test
          -project NoteApp.xcodeproj
          -scheme NoteApp
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -derivedDataPath build/derived
          -only-testing:NoteAppUITests

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: /tmp/shots/
          if-no-files-found: warn
