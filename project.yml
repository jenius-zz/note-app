name: NoteApp
options:
  bundleIdPrefix: com.localnote
  deploymentTarget:
    iOS: "17.0"
targets:
  NoteApp:
    type: application
    platform: iOS
    sources:
      - path: NoteApp
    scheme:
      testTargets:
        - NoteAppUITests
    entitlements:
      path: NoteApp/NoteApp.entitlements
    dependencies:
      # extension 作为 target 依赖，Xcode 自动生成 "Embed App Extensions" 阶段
      - target: NoteAppWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localnote.NoteApp
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: NoteApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLName: com.localnote.NoteApp.urlscheme
            CFBundleURLSchemes:
              - noteapp
        NSSpeechRecognitionUsageDescription: "用于将你的语音转为文字，只在本地识别，不上传录音"
        NSMicrophoneUsageDescription: "用于语音速记，把说话转为文字"
  NoteAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NoteAppWidget
      - path: NoteApp/Models.swift
      - path: NoteApp/Shared
      - path: NoteApp/Recap
    entitlements:
      path: NoteAppWidget/NoteAppWidget.entitlements
    settings:
      base:
        # App Extension 的 bundle ID 必须是主 App bundle ID 的前缀，否则装不到模拟器/真机
        PRODUCT_BUNDLE_IDENTIFIER: com.localnote.NoteApp.NoteAppWidget
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: NoteAppWidget/Info.plist
      properties:
        CFBundleDisplayName: 速记
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NoteAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoteAppUITests
    dependencies:
      - target: NoteApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localnote.NoteAppUITests
        PRODUCT_NAME: NoteAppUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
