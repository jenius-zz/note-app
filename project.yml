name: NoteApp
options:
  bundleIdPrefix: com.localnote
  deploymentTarget:
    iOS: "17.0"
targets:
  NoteApp:
    type: application
    platform: iOS
    sources:
      - path: NoteApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localnote.NoteApp
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
